[project]
name = "vaultlines"
version = "0.3.0"
description = "Personal and team markdown vaults for Claude Code. Git syncs them, GitHub says who can see each one, and a Claude Code hook stops a session from copying notes to people who could not see them."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kabir Sarin" }]
requires-python = ">=3.11"
dependencies = ["tomli-w>=1.0"]
keywords = ["claude", "claude-code", "basic-memory", "obsidian", "knowledge-base", "mcp"]

[project.scripts]
vl = "vaultlines:main"

[project.urls]
Homepage = "https://github.com/sarink/vaultlines"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
